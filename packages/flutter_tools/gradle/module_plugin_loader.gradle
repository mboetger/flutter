// This file is kept for backward compatibility with old templates.
// It delegates to the new Kotlin settings plugin.
File pathToThisDirectory = buildscript.sourceFile.parentFile
if (binding.variables.containsKey("mainModuleName")) {
    ext.mainModuleName = binding.variables["mainModuleName"]
}
pluginManagement {
    includeBuild(pathToThisDirectory.absolutePath)
}
apply plugin: 'dev.flutter.flutter-module-plugin-loader'
