// This file is included from `<module>/.android/include_flutter.groovy`,
// so it can be versioned with the Flutter SDK.

import java.nio.file.Paths

File pathToThisDirectory = buildscript.sourceFile.parentFile
apply from: Paths.get(pathToThisDirectory.absolutePath, "src", "main", "scripts", "native_plugin_loader.gradle.kts")

def moduleProjectRoot = project(':flutter').projectDir.parentFile.parentFile

List<Map<String, Object>> nativePlugins = nativePluginLoader.getPlugins(moduleProjectRoot)
nativePlugins.each { androidPlugin ->
    def pluginDirectory = new File(androidPlugin.path as String, 'android')
    assert pluginDirectory.exists()
    include ":${androidPlugin.name}"
    project(":${androidPlugin.name}").projectDir = pluginDirectory

    // Also include subprojects of the plugin.
    def settingsGradle = new File(pluginDirectory, "settings.gradle")
    def settingsGradleKts = new File(pluginDirectory, "settings.gradle.kts")
    def subprojects = findSubprojects(settingsGradle) + findSubprojects(settingsGradleKts)
    subprojects.unique().each { subproject ->
        def normalizedSubproject = subproject.startsWith(":") ? subproject : ":" + subproject
        def subprojectPath = normalizedSubproject.substring(1).replace(":", File.separator)
        def subprojectDir = new File(pluginDirectory, subprojectPath)
        if (!subprojectDir.exists()) {
            throw new org.gradle.api.GradleException(
                "Plugin '${androidPlugin.name}' declares subproject '${normalizedSubproject}', " +
                "but the directory '${subprojectDir.absolutePath}' does not exist. " +
                "Note that custom 'projectDir' assignments in the plugin's settings.gradle are not supported."
            )
        }

        def existingProject = findProject(normalizedSubproject)
        if (existingProject != null) {
            def existingProjectDir = existingProject.projectDir.canonicalFile
            def newProjectDir = subprojectDir.canonicalFile
            if (existingProjectDir != newProjectDir) {
                throw new org.gradle.api.GradleException(
                    "Plugin '${androidPlugin.name}' is trying to include Gradle subproject '${normalizedSubproject}' mapped to '${newProjectDir}', " +
                    "but it is already defined by another plugin or the app mapped to '${existingProjectDir}'. " +
                    "To resolve this, ensure all Gradle subprojects have unique names across all plugins."
                )
            }
        } else {
            include normalizedSubproject
            project(normalizedSubproject).projectDir = subprojectDir
        }
    }
}

/**
 * Finds all subprojects defined in a plugin's settings.gradle or settings.gradle.kts.
 *
 * Note: This parser does not support custom `projectDir` assignments for subprojects.
 * It assumes the subprojects follow the default Gradle directory layout.
 */
def findSubprojects(File gradleSettingsFile) {
    if (!gradleSettingsFile.exists()) {
        return []
    }
    def subprojects = [] as Set
    def content = gradleSettingsFile.text.replaceAll(/\/\/.*|\/\*(?s).*?\*\//, "")

    // 1. include(...)
    def includeWithParens = content =~ /(?s)\binclude\s*\(\s*([^)]+)\)/
    while (includeWithParens.find()) {
        def arguments = includeWithParens.group(1)
        def stringMatcher = arguments =~ /['"]([^'"]+)['"]/
        while (stringMatcher.find()) {
            def projectPath = stringMatcher.group(1)
            subprojects.add(projectPath.startsWith(":") ? projectPath : ":" + projectPath)
        }
    }

    // 2. include ...
    def includeWithoutParens = content =~ /\binclude\s+([^;\n]+)/
    while (includeWithoutParens.find()) {
        def arguments = includeWithoutParens.group(1)
        def stringMatcher = arguments =~ /['"]([^'"]+)['"]/
        while (stringMatcher.find()) {
            def projectPath = stringMatcher.group(1)
            subprojects.add(projectPath.startsWith(":") ? projectPath : ":" + projectPath)
        }
    }
    return subprojects.toList()
}

String flutterModulePath = project(':flutter').projectDir.parentFile.getAbsolutePath()
gradle.getGradle().projectsLoaded { g ->
    g.rootProject.beforeEvaluate { p ->
        p.subprojects { subproject ->
            if (nativePlugins.name.contains(subproject.name)) {
                File androidPluginBuildOutputDir = new File(flutterModulePath + File.separator
                        + "plugins_build_output" + File.separator + subproject.name)
                if (!androidPluginBuildOutputDir.exists()) {
                    androidPluginBuildOutputDir.mkdirs()
                }
                subproject.layout.buildDirectory.fileValue(androidPluginBuildOutputDir)
            }
        }
        def _mainModuleName = binding.variables['mainModuleName']
        if (_mainModuleName != null && !_mainModuleName.empty) {
            p.ext.mainModuleName = _mainModuleName
        }
    }
    g.rootProject.afterEvaluate { p ->
        p.subprojects { sp ->
            if (sp.name != 'flutter') {
                sp.evaluationDependsOn(':flutter')
            }
        }
    }
}
