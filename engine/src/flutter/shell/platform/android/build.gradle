// This file only exists to provide IDE support to Android Studio.
//
// See ./README.md for details.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Consult the Android team before bumping. This is only used for IDE support, so
        // it does not need to be bumped as part of most repo-wide upgrades.
        classpath "com.android.tools.build:gradle:8.9.1"
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: "com.android.library"

android {
    namespace = "io.flutter.embedding"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java {
                srcDirs = ['.']
                include 'io/flutter/**'
                exclude 'build/**'
                exclude 'test/**'
                exclude '.gradle/**'
            }
        }
        debug {
            manifest.srcFile 'src/debug/AndroidManifest.xml'
        }
        test {
            java {
                srcDirs = ['test']
                include 'io/flutter/**'
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            jvmArgs "-Xmx8g"
            maxHeapSize "8g"
        }
    }

    dependencies {
        implementation "androidx.activity:activity:1.8.1"
        implementation "androidx.annotation:annotation:1.8.1"
        implementation "androidx.annotation:annotation-experimental:1.4.0"
        implementation "androidx.collection:collection:1.1.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.customview:customview:1.0.0"
        implementation "androidx.exifinterface:exifinterface:1.4.1"
        implementation "androidx.fragment:fragment:1.7.1"
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1"
        implementation "androidx.lifecycle:lifecycle-common:2.7.0"
        implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
        implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
        implementation "androidx.lifecycle:lifecycle-livedata-core:2.7.0"
        implementation "androidx.lifecycle:lifecycle-process:2.7.0"
        implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
        implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
        implementation "androidx.loader:loader:1.0.0"
        implementation "androidx.savedstate:savedstate:1.2.1"
        implementation "androidx.tracing:tracing:1.2.0"
        implementation "androidx.versionedparcelable:versionedparcelable:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "androidx.window:window:1.2.0"
        implementation "androidx.window:window-java:1.2.0"
        implementation "com.getkeepsafe.relinker:relinker:1.4.5"

        // These dependencies should be kept in line with those in the ./test_runner/build.gradle
        implementation "androidx.test:core:1.6.1"
        implementation "com.google.android.play:core:1.8.0"
        implementation "com.ibm.icu:icu4j:75.1"
        implementation "org.robolectric:robolectric:4.16"
        implementation "junit:junit:4.13.2"
        implementation "androidx.test.ext:junit:1.2.1"

        def mockitoVersion = "5.17.0"
        implementation "org.mockito:mockito-core:$mockitoVersion"

    }
}
